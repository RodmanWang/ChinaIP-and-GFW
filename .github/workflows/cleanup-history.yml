name: Preview ChinaIP-and-GFW history cleanup

on:
  workflow_dispatch:

concurrency:
  group: preview-chinaip-history-cleanup
  cancel-in-progress: true

jobs:
  preview:
    name: Preview history cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Find cutoff commit
        run: |
          set -e

          KEEP_DAYS=180

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Keep days:"
          echo "$KEEP_DAYS"

          FIRST_KEEP=""

          while read COMMIT
          do
            TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$TIME" -ge "$CUTOFF" ]; then
              FIRST_KEEP="$COMMIT"
              break
            fi

          done < <(git rev-list --reverse HEAD)

          if [ -z "$FIRST_KEEP" ]; then
            echo "No cleanup required"
            exit 0
          fi

          echo "$FIRST_KEEP" > /tmp/first_keep

          echo "First kept commit:"
          cat /tmp/first_keep

      - name: Rewrite history preview
        run: |
          set -e

          FIRST_KEEP=$(cat /tmp/first_keep)

          git checkout -b cleanup-preview "$FIRST_KEEP"

          echo "Before:"
          git rev-list --count HEAD

          git checkout main

          git filter-branch \
            --force \
            --env-filter '
            ' \
            -- --all

          git checkout cleanup-preview

          echo "After:"
          git rev-list --count HEAD

      - name: Verify
        run: |
          set -e

          echo "Commit list:"
          git log --oneline -30

          echo ""

          echo "Count:"
          git rev-list --count HEAD
