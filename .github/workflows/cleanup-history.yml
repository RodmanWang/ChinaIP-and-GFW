name: Preview ChinaIP-and-GFW history rebuild

on:
  workflow_dispatch:

concurrency:
  group: preview-chinaip-history-rebuild
  cancel-in-progress: true

jobs:
  preview:
    name: Preview history rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare test copy
        run: |
          set -e

          mkdir ../original

          rsync -a --exclude=.git ./ ../original/

          git clone . ../rewrite-test

      - name: Calculate history range
        run: |
          set -e

          KEEP_DAYS=180

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Keep days: $KEEP_DAYS"
          echo "Cutoff:"
          date -d "@$CUTOFF"

          cd ../rewrite-test

          FIRST_KEEP=$(git rev-list --reverse main | while read COMMIT
          do
            TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$TIME" -ge "$CUTOFF" ]; then
              echo "$COMMIT"
              break
            fi
          done)

          echo "First commit kept:"
          echo "$FIRST_KEEP"

          echo "$FIRST_KEEP" > /tmp/first_keep_commit

      - name: Rebuild preview history
        run: |
          set -e

          cd ../rewrite-test

          FIRST_KEEP=$(cat /tmp/first_keep_commit)

          if [ -z "$FIRST_KEEP" ]; then
            echo "No cleanup required"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"

          git checkout --orphan clean-main

          git rm -rf . >/dev/null 2>&1 || true

          rsync -a ../original/ ./

          git add .

          git commit -m "Initial history snapshot"

          git cherry-pick "$FIRST_KEEP"..main || true

      - name: Compare result
        run: |
          set -e

          echo "Original commits:"
          cd "$GITHUB_WORKSPACE"
          git rev-list --count main

          echo ""

          echo "Preview commits:"
          cd ../rewrite-test
          git rev-list --count clean-main

          echo ""

          echo "Preview latest commits:"
          git log clean-main --oneline -20

          echo ""

          echo "Preview repository size:"
          du -sh .git
