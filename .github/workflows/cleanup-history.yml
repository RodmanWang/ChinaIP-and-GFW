name: Preview ChinaIP-and-GFW history cleanup

on:
  workflow_dispatch:

concurrency:
  group: preview-chinaip-history-cleanup
  cancel-in-progress: true

jobs:
  preview:
    name: Preview history cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install git-filter-repo
        run: |
          sudo apt update
          sudo apt install -y git-filter-repo

      - name: Find first commit to keep
        run: |
          set -e

          KEEP_DAYS=180

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Keep days:"
          echo "$KEEP_DAYS"

          echo "Cutoff:"
          date -d "@$CUTOFF"

          FIRST_KEEP=""

          while read COMMIT
          do
            TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$TIME" -ge "$CUTOFF" ]; then
              FIRST_KEEP="$COMMIT"
              break
            fi

          done < <(git rev-list --reverse HEAD)

          if [ -z "$FIRST_KEEP" ]; then
            echo "No cleanup required"
            exit 0
          fi

          echo "$FIRST_KEEP" > /tmp/first_keep

          echo "First keep commit:"
          cat /tmp/first_keep

      - name: Rewrite history
        run: |
          set -e

          FIRST_KEEP=$(cat /tmp/first_keep)

          python3 > /tmp/filter.py <<PY
KEEP_COMMIT = b"$FIRST_KEEP"

def callback(commit, metadata):
    if commit.original_id == KEEP_COMMIT:
        commit.parents = []

PY

          echo "Before cleanup:"
          git rev-list --count HEAD

          git filter-repo \
            --force \
            --commit-callback "$(cat /tmp/filter.py)"

      - name: Verify result
        run: |
          set -e

          echo "===================="

          echo "Commit count:"
          git rev-list --count HEAD

          echo ""

          echo "Latest commits:"
          git log --oneline -30

          echo ""

          echo "Repository size:"
          du -sh .git
