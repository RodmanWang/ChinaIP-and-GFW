name: Preview ChinaIP-and-GFW history cleanup

on:
  workflow_dispatch:

concurrency:
  group: preview-chinaip-history-cleanup
  cancel-in-progress: true

jobs:
  preview:
    name: Preview history cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y git-filter-repo

      - name: Backup current tree
        run: |
          set -e

          git archive HEAD | tar -x -C /tmp

          echo "Current source saved"

      - name: Find cutoff commit
        run: |
          set -e

          KEEP_DAYS=180

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Keep days:"
          echo "$KEEP_DAYS"

          echo "Cutoff:"
          date -d "@$CUTOFF"

          FIRST_KEEP=""

          while read COMMIT
          do
            TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$TIME" -ge "$CUTOFF" ]; then
              FIRST_KEEP="$COMMIT"
              break
            fi

          done < <(git rev-list --reverse HEAD)

          if [ -z "$FIRST_KEEP" ]; then
            echo "No cleanup required"
            exit 0
          fi

          echo "$FIRST_KEEP" > /tmp/first_keep

          echo "First kept commit:"
          cat /tmp/first_keep


      - name: Rewrite history
        run: |
          set -e

          FIRST_KEEP=$(cat /tmp/first_keep)

          cat > /tmp/filter.py <<'PY'
commit = commit
PY

          git filter-repo \
            --force \
            --commit-callback '
if commit.original_id == b"'$(git rev-parse "$FIRST_KEEP")'":
    commit.parents = []
'


      - name: Verify result
        run: |
          set -e

          echo "===================="

          echo "Commit count:"
          git rev-list --count HEAD

          echo ""

          echo "Latest commits:"
          git log --oneline -30

          echo ""

          echo "Repository size:"
          du -sh .git
