name: Check ChinaIP-and-GFW history

on:
  workflow_dispatch:

concurrency:
  group: check-chinaip-gfw-history
  cancel-in-progress: true

jobs:
  check:
    name: Check git history
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check repository history
        run: |
          set -e

          KEEP_DAYS=180

          echo "Keep days:"
          echo "$KEEP_DAYS"

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo ""
          echo "Cutoff timestamp:"
          echo "$CUTOFF"

          echo ""
          echo "Cutoff date:"
          date -d "@$CUTOFF"

          echo ""
          echo "Total commits:"
          git rev-list --count HEAD

          echo ""
          echo "Latest commits:"
          git log --oneline -20

          echo ""
          echo "Oldest commit:"
          git log --reverse --format="%h %ad %s" --date=short | head -1

          echo ""
          echo "Newest commit:"
          git log -1 --format="%h %ad %s" --date=short

      - name: Check repository size
        run: |
          echo "Git size:"
          du -sh .git
