name: Preview ChinaIP-and-GFW history cleanup

on:
  workflow_dispatch:

concurrency:
  group: preview-chinaip-gfw-cleanup
  cancel-in-progress: true

jobs:
  preview:
    name: Preview cleanup result
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y git-filter-repo

      - name: Create preview cleanup
        run: |
          set -e

          KEEP_DAYS=180

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Keep days: $KEEP_DAYS"
          echo "Cutoff:"
          date -d "@$CUTOFF"

          git clone . ../clean-preview

          cd ../clean-preview

          git filter-repo \
            --force \
            --commit-callback "if int(commit.author_date.split()[0]) < $CUTOFF: commit.skip()"

      - name: Compare result
        run: |
          echo "Original commits:"
          git rev-list --count HEAD

          echo ""

          echo "Preview commits:"
          cd ../clean-preview
          git rev-list --count HEAD

          echo ""

          echo "Preview latest commits:"
          git log --oneline -20

          echo ""

          echo "Preview size:"
          du -sh .git
