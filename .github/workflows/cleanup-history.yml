name: Preview ChinaIP-and-GFW history rebuild

on:
  workflow_dispatch:

concurrency:
  group: preview-chinaip-history-rebuild
  cancel-in-progress: true

jobs:
  preview:
    name: Preview history rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare test repository
        run: |
          set -e

          git clone . ../rewrite-test

      - name: Calculate history range
        run: |
          set -e

          KEEP_DAYS=180

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Keep days:"
          echo "$KEEP_DAYS"

          echo "Cutoff date:"
          date -d "@$CUTOFF"

          cd ../rewrite-test

          OLD_HEAD=$(git rev-parse HEAD)

          FIRST_KEEP=""

          while read COMMIT
          do
            TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$TIME" -ge "$CUTOFF" ]; then
              FIRST_KEEP="$COMMIT"
              break
            fi
          done < <(git rev-list --reverse HEAD)

          if [ -z "$FIRST_KEEP" ]; then
            echo "No cleanup required"
            exit 0
          fi

          echo "$OLD_HEAD" > /tmp/old_head
          echo "$FIRST_KEEP" > /tmp/first_keep

          echo ""
          echo "Old HEAD:"
          cat /tmp/old_head

          echo ""
          echo "First kept commit:"
          cat /tmp/first_keep

          echo ""
          echo "Commits to keep:"
          git rev-list --count "$FIRST_KEEP".."$OLD_HEAD"

      - name: Rebuild preview history
        run: |
          set -e

          cd ../rewrite-test

          OLD_HEAD=$(cat /tmp/old_head)
          FIRST_KEEP=$(cat /tmp/first_keep)

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"

          echo "Create clean branch"

          git checkout "$FIRST_KEEP"

          git checkout -b clean-main

          echo ""
          echo "Cherry-pick recent history"

          git cherry-pick "$FIRST_KEEP".."$OLD_HEAD" || true

          while git rev-parse --verify CHERRY_PICK_HEAD >/dev/null 2>&1
          do
            echo "Skip empty cherry-pick"

            git cherry-pick --skip || true
          done

      - name: Compare result
        run: |
          set -e

          echo "===================="

          echo "Original commits:"
          cd "$GITHUB_WORKSPACE"
          git rev-list --count HEAD

          echo ""

          echo "Preview commits:"
          cd ../rewrite-test
          git rev-list --count clean-main

          echo ""

          echo "Preview latest commits:"
          git log clean-main --oneline -20

          echo ""

          echo "Preview repository size:"
          du -sh .git
