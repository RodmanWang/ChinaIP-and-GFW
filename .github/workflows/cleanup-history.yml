name: Preview ChinaIP-and-GFW history cleanup

on:
  workflow_dispatch:

concurrency:
  group: preview-chinaip-history-cleanup
  cancel-in-progress: true

jobs:
  preview:
    name: Preview history cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Find cutoff commit
        run: |
          set -e

          KEEP_DAYS=180

          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Keep days:"
          echo "$KEEP_DAYS"

          echo "Cutoff:"
          date -d "@$CUTOFF"

          FIRST_KEEP=""

          while read COMMIT
          do
            TIME=$(git show -s --format=%ct "$COMMIT")

            if [ "$TIME" -ge "$CUTOFF" ]; then
              FIRST_KEEP="$COMMIT"
              break
            fi

          done < <(git rev-list --reverse HEAD)

          if [ -z "$FIRST_KEEP" ]; then
            echo "No cleanup required"
            exit 0
          fi

          echo "$FIRST_KEEP" > /tmp/first_keep

          echo "First commit to keep:"
          git show -s --format="%h %ad %s" --date=short "$FIRST_KEEP"

      - name: Rebuild clean history
        run: |
          set -e

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"

          FIRST_KEEP=$(cat /tmp/first_keep)

          OLD_HEAD=$(git rev-parse HEAD)

          echo "Save current source"

          mkdir -p /tmp/current-source

          git archive "$OLD_HEAD" | tar -x -C /tmp/current-source

          echo "Create clean branch"

          git checkout --orphan clean-main

          git rm -rf . >/dev/null 2>&1 || true

          cp -a /tmp/current-source/. .

          git add .

          git commit -m "Initial history snapshot"

          echo "Apply recent history"

          git cherry-pick "$FIRST_KEEP".."$OLD_HEAD" || true

          while git rev-parse --verify CHERRY_PICK_HEAD >/dev/null 2>&1
          do
            echo "Resolve conflict automatically"

            git checkout --theirs .

            git add .

            git cherry-pick --continue || git cherry-pick --skip || true
          done

      - name: Verify result
        run: |
          set -e

          echo "===================="

          echo "Original commits:"
          git rev-list --count main

          echo ""

          echo "Preview commits:"
          git rev-list --count HEAD

          echo ""

          echo "Latest commits:"
          git log --oneline -30

          echo ""

          echo "Repository size:"
          du -sh .git
